name: Feature
description: A new capability for sellers, agents or carriers
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "Who has this problem and what does it cost them today?" }
    validations: { required: true }
  - type: textarea
    id: solution
    attributes: { label: Proposed solution }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, value: "- [ ] " }
