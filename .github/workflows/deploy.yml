name: Deploy

# dev -> staging automatically; main -> production after Samir approves the `production`
# environment. Re-run with an older image tag to roll back (see docs/runbook.md).
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: staging or production
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: Existing image tag to deploy (rollback). Empty = build this commit.
        required: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.services }}
      environment: ${{ steps.plan.outputs.environment }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          services=$(ls services | jq -R . | jq -cs .)
          if [ -n "$INPUT_ENV" ]; then env="$INPUT_ENV"; elif [ "$GITHUB_REF_NAME" = main ]; then env=production; else env=staging; fi
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"; build=false; else tag="sha-${GITHUB_SHA::7}"; build=true; fi
          { echo "services=$services"; echo "environment=$env"; echo "tag=$tag"; echo "build=$build"; } >> "$GITHUB_OUTPUT"

  images:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.plan.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/service.Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            RELEASE=${{ needs.plan.outputs.tag }}
          push: true
          tags: ghcr.io/samir-guenchi/trackecom-${{ matrix.service }}:${{ needs.plan.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [plan, images]
    if: always() && needs.plan.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    # Secrets live in the GitHub environment; `production` requires Samir's approval.
    environment:
      name: ${{ needs.plan.outputs.environment }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      IMAGE_TAG: ${{ needs.plan.outputs.tag }}
      SERVICES: ${{ needs.plan.outputs.services }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip until the environment is configured
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::No DEPLOY_HOST secret in '${{ needs.plan.outputs.environment }}'; images are built, nothing deployed. See docs/runbook.md."
      - name: Configure SSH
        if: env.DEPLOY_HOST != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload stack files and environment
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          target="$DEPLOY_USER@$DEPLOY_HOST"
          { printf '%s\n' "$ENV_FILE"; echo "IMAGE_TAG=$IMAGE_TAG"; } > deploy/.env
          scp -i ~/.ssh/id_deploy deploy/compose.yml deploy/Caddyfile deploy/.env "$target:/opt/trackecom/"
          rm deploy/.env
      - name: Migrate and roll out
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          migrations=$(echo "$SERVICES" | jq -r '.[] | select(. != "gateway") | "\(.)-migrate"' | tr '\n' ' ')
          target="$DEPLOY_USER@$DEPLOY_HOST"
          # The short-lived job token goes through stdin, never through the command line.
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy "$target" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -i ~/.ssh/id_deploy "$target" "
            set -e; cd /opt/trackecom
            docker compose pull --quiet
            for job in $migrations; do docker compose --profile migrate run --rm \$job; done
            docker compose up -d --remove-orphans --wait
            docker image prune -f
          "
      - name: Smoke test
        if: env.DEPLOY_HOST != ''
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          [ -z "$HEALTH_URL" ] && { echo "::notice::Set the HEALTH_URL variable to enable the smoke test"; exit 0; }
          for i in $(seq 1 20); do curl -fsS "$HEALTH_URL" && exit 0; sleep 6; done
          echo "::error::$HEALTH_URL did not become ready"; exit 1
