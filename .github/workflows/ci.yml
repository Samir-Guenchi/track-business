name: CI

# Required check for dev and main (add "CI / verify" to both rulesets, see docs/WORKFLOW.md).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trackecom
          POSTGRES_PASSWORD: trackecom
          POSTGRES_DB: trackecom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trackecom" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Integration tests (*.int.spec.ts) create their own database per service on this server.
      TEST_DATABASE_URL: postgresql://trackecom:trackecom@localhost:5432/trackecom
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high and critical fail)
        run: pnpm audit --audit-level high --prod

      - run: pnpm format:check

      - name: Lint, type-check, test, build
        run: pnpm turbo run lint typecheck test build --cache-dir=.turbo/cache --summarize

      - name: Test summary
        if: always()
        run: |
          {
            echo '### CI'
            echo ''
            echo '| Task | Result |'
            echo '|---|---|'
            jq -r '.tasks[] | "| \(.taskId) | \(.execution.exitCode // "skipped" | if . == 0 then "pass" elif . == "skipped" then "skipped" else "fail" end) |"' .turbo/runs/*.json
          } >> "$GITHUB_STEP_SUMMARY"
