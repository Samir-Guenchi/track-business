<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">TrackEcom icon</title>
  <g transform="translate(0 0) scale(1.0)">
    <rect x="8" y="8" width="240" height="240" rx="64" fill="#0E5C3F"/>
    <!-- pencil sketch under-stroke: the human touch -->
    <path d="M54 88 C 96 74, 156 84, 204 68" fill="none" stroke="#F3E3C3" stroke-opacity=".6" stroke-width="3" stroke-linecap="round" transform="translate(3 -7) rotate(-1.5 128 84)"/>
    <path d="M131 88 C 126 116, 135 132, 129 152" fill="none" stroke="#F3E3C3" stroke-opacity=".6" stroke-width="3" stroke-linecap="round" transform="translate(-8 2)"/>
    <!-- crossbar: origin -> hub -->
    <path d="M52 90 C 94 76, 154 86, 204 72" fill="none" stroke="#FFF4E2" stroke-width="28" stroke-linecap="round"/>
    <!-- stem: route, delivered part solid -->
    <path d="M128 88 C 123 114, 134 132, 127 150" fill="none" stroke="#FFF4E2" stroke-width="28" stroke-linecap="round"/>
    <!-- in-transit part dashed -->
    <path d="M127 170 C 125 176, 126 181, 128 186.5" fill="none" stroke="#FFF4E2" stroke-width="11" stroke-linecap="round" stroke-dasharray="0.1 16.6"/>
    <!-- origin checkpoint -->
    <circle cx="52" cy="90" r="7" fill="#0E5C3F"/>
    <!-- destination: live pulse -->
    <circle cx="128" cy="214" r="23" fill="none" stroke="#E2463A" stroke-opacity=".55" stroke-width="3.5"/>
    <circle cx="128" cy="214" r="14" fill="#E2463A"/>
    <circle cx="123" cy="209" r="4" fill="#fff" fill-opacity=".55"/>
  </g>
</svg>
